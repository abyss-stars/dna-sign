name: Auto Sign - 二重螺旋
on:
  workflow_dispatch:

jobs:
  sign:
    # 不要用 ubuntu-latest：它会随镜像滚更（2026-11-11 已滚到 ubuntu-26.04，
    # 旧版 setup-python 找不到对应 Python 预编译包）。固定到长期支持的 LTS 镜像。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sign
        env:
          DNA_TOKEN: ${{ secrets.DNA_TOKEN }}
          DNA_DEVICE_CODE: ${{ secrets.DNA_DEVICE_CODE }}
          DNA_REFRESH_TOKEN: ${{ secrets.DNA_REFRESH_TOKEN }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
          SC3_UID: ${{ secrets.SC3_UID }}
          EXIT_WHEN_FAIL: ${{ vars.EXIT_WHEN_FAIL }}
        run: |
          python src/main.py
